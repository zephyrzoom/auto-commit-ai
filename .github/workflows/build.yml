name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --windowed --onefile --name "GitSyncTool" --collect-all PyQt6 main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GitSyncTool-windows
          path: dist/GitSyncTool.exe
